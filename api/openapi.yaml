      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Código o destinatario
          title: Q
        description: Código o destinatario
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Estado
      - name: zona_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Zona Id
      - name: desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Desde
      - name: hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Hasta
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limite
      - name: desplazamiento
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Desplazamiento
      - name: x-actor-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          description: UUID del usuario que realiza la petición
