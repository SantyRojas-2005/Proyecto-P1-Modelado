components:
  schemas:
    AceptacionAsignacion:
      properties:
        evento_id:
          type: string
          maxLength: 60
          minLength: 3
          title: Evento Id
      type: object
      required:
      - evento_id
      title: AceptacionAsignacion
    Asignacion:
      properties:
        evento_id:
          type: string
          maxLength: 60
          minLength: 3
          title: Evento Id
        envio_codigo:
          type: string
          maxLength: 20
          minLength: 3
          title: Envio Codigo
        repartidor_id:
          type: string
          format: uuid
          title: Repartidor Id
      type: object
      required:
      - evento_id
      - envio_codigo
      - repartidor_id
      title: Asignacion
    CambioEstado:
      properties:
        evento_id:
          type: string
          maxLength: 60
          minLength: 3
          title: Evento Id
        nuevo_estado:
          type: string
          maxLength: 20
          title: Nuevo Estado
        nota:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 0
          - type: 'null'
          title: Nota
        ubicacion:
          anyOf:
          - $ref: '#/components/schemas/Coordenada'
          - type: 'null'
      type: object
      required:
      - evento_id
      - nuevo_estado
      title: CambioEstado
    CapacidadUpdate:
      properties:
        capacidad_max:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Capacidad Max
      type: object
      required:
      - capacidad_max
      title: CapacidadUpdate
    Coordenada:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
      type: object
      required:
      - lat
      - lng
      title: Coordenada
    Entrega:
      properties:
        evento_id:
          type: string
          maxLength: 60
          minLength: 3
          title: Evento Id
        receptor_nombre:
          type: string
          maxLength: 100
          minLength: 1
          title: Receptor Nombre
        observacion:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 0
          - type: 'null'
          title: Observacion
        foto_url:
          anyOf:
          - type: string
            maxLength: 300
            minLength: 0
          - type: 'null'
          title: Foto Url
        firma_simulada:
          type: boolean
          title: Firma Simulada
          default: true
      type: object
      required:
      - evento_id
      - receptor_nombre
      title: Entrega
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    NuevoEnvio:
      properties:
        remitente:
          type: string
          maxLength: 100
          minLength: 1
          title: Remitente
        destinatario:
          type: string
          maxLength: 100
          minLength: 1
          title: Destinatario
        origen:
          $ref: '#/components/schemas/Coordenada'
        destino:
          $ref: '#/components/schemas/Coordenada'
        origen_direccion:
          anyOf:
          - type: string
            maxLength: 150
            minLength: 0
          - type: 'null'
          title: Origen Direccion
        destino_direccion:
          anyOf:
          - type: string
            maxLength: 150
            minLength: 0
          - type: 'null'
          title: Destino Direccion
        zona_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Zona Id
        tipo_servicio_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Tipo Servicio Id
        cliente_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Cliente Id
      type: object
      required:
      - remitente
      - destinatario
      - origen
      - destino
      - zona_id
      - tipo_servicio_id
      title: NuevoEnvio
    TipoServicioIn:
      properties:
        nombre:
          type: string
          maxLength: 60
          minLength: 1
          title: Nombre
        tarifa_base:
          type: number
          maximum: 999999.0
          minimum: 0.0
          title: Tarifa Base
        tiempo_estimado_min:
          type: integer
          maximum: 10000.0
          exclusiveMinimum: 0.0
          title: Tiempo Estimado Min
      type: object
      required:
      - nombre
      - tarifa_base
      - tiempo_estimado_min
      title: TipoServicioIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ZonaIn:
      properties:
        nombre:
          type: string
          maxLength: 80
          minLength: 1
          title: Nombre
        activa:
          type: boolean
          title: Activa
          default: true
      type: object
      required:
      - nombre
      title: ZonaIn
