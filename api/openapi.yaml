openapi: 3.1.0
info:
  title: API Mensajería urbana
  description: 'Persistencia políglota: PostgreSQL (estado y asignaciones), MongoDB (historial y evidencias) y Redis
    (estado temporal). Las cabeceras X-Actor-Id y X-Actor-Rol identifican al usuario (simplificación del laboratorio;
    no es autenticación real).'
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Salud
      summary: Estado de la API y sus dependencias
      operationId: salud_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '503':
          description: Alguna dependencia caída (estado 'degradado')
  /zonas:
    get:
      tags:
      - Catálogos
      summary: Zonas activas (público)
      operationId: zonas_zonas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - Administración
      summary: Crear zona
      operationId: crear_zona_zonas_post
      parameters:
      - name: x-actor-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          description: UUID del usuario que realiza la petición
          title: X-Actor-Id
        description: UUID del usuario que realiza la petición
      - name: x-actor-rol
        in: header
        required: true
        schema:
          type: string
          description: cliente | operador | repartidor | admin
          title: X-Actor-Rol
        description: cliente | operador | repartidor | admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonaIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '403':
          description: 'NO_PERMITIDO: el rol o el usuario no puede realizar la operación'
          content:
            application/json:
              example:
                error:
                  codigo: CODIGO_ESTABLE
                  mensaje: texto legible
                  detalles: {}
        '404':
          description: 'NO_ENCONTRADO: el recurso no existe o no es visible para este usuario'
          content:
            application/json:
              example:
                error:
                  codigo: CODIGO_ESTABLE
                  mensaje: texto legible
                  detalles: {}
        '409':
          description: CONFLICTO, TRANSICION_INVALIDA, CAPACIDAD_EXCEDIDA o ENVIO_YA_ASIGNADO
          content:
            application/json:
              example:
                error:
                  codigo: CODIGO_ESTABLE
                  mensaje: texto legible
                  detalles: {}
        '503':
          description: 'DEPENDENCIA_NO_DISPONIBLE: una base de datos no responde (reintentable)'
          content:
            application/json:
              example:
                error:
                  codigo: CODIGO_ESTABLE
                  mensaje: texto legible
                  detalles: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
