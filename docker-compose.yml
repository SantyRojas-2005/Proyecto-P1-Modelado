services:
  # 1. PostgreSQL 16: fuente de verdad (envíos, asignaciones, catálogos, outbox) y búsqueda operativa
  postgres:
    image: postgres:16-alpine
    container_name: mensajeria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Esquema y datos semilla: solo se ejecutan cuando el volumen está vacío
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    # Sin "ports": la base solo es accesible por la red interna (usar docker exec para consultarla)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mensajeria_net

  # 2. MongoDB 7: historial de seguimiento (proyección del outbox) y evidencias de entrega
  mongo:
    image: mongo:7.0
    container_name: mensajeria_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mensajeria_net

  # 3. Redis 7: estado temporal (posición y conexión con TTL), sin persistencia en disco
  redis:
    image: redis:7-alpine
    container_name: mensajeria_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - mensajeria_net

  # 4. API REST (FastAPI): único punto de entrada de la web
  api:
    build:
      context: ./api
    container_name: mensajeria_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mensajeria_net

  # 5. Worker: sincroniza el outbox de PostgreSQL hacia MongoDB
  worker:
    build:
      context: ./api
    container_name: mensajeria_worker
    restart: unless-stopped
    command: ["python", "-m", "worker.sync"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - mensajeria_net

  # 6. Frontend (Nginx con HTML/CSS/JS estáticos)
  frontend:
    build:
      context: ./frontend
    container_name: mensajeria_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - mensajeria_net

volumes:
  pg_data:
    name: mensajeria_pg_data
  mongo_data:
    name: mensajeria_mongo_data
  # Redis no tiene volumen: sus datos son temporales por diseño

networks:
  mensajeria_net:
    name: mensajeria_network
    driver: bridge
